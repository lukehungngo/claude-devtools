<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:16px;background:var(--bg);}
.row{display:flex;gap:8px;}
.sw{flex:1;border-radius:var(--r-sm);padding:10px;border:1px solid var(--bd);min-height:72px;display:flex;flex-direction:column;justify-content:space-between;}
.sw .lbl{font-family:var(--font-mono);font-size:9px;color:var(--t2);}
.sw .hex{font-family:var(--font-mono);font-size:10px;color:var(--t1);}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--acc);color:#fff"><div class="lbl" style="color:rgba(255,255,255,.8)">ACCENT</div><div class="hex" style="color:#fff">#C2592E</div></div>
  <div class="sw" style="background:var(--acc-h);color:#fff"><div class="lbl" style="color:rgba(255,255,255,.8)">HOVER</div><div class="hex" style="color:#fff">#A84A24</div></div>
  <div class="sw" style="background:var(--acc-bg)"><div class="lbl">ACCENT/BG</div><div class="hex">10% α</div></div>
  <div class="sw" style="background:var(--acc-bg-strong)"><div class="lbl">ACCENT/BG·STRONG</div><div class="hex">18% α</div></div>
</div>
</body></html>
