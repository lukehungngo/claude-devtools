<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>

<div class="grid">

  <span class="pill" style="background:var(--teal-bg);color:var(--teal)">Plan</span>

  <span class="pill" style="background:var(--amb-bg);color:var(--amb)">Don't Ask</span>
