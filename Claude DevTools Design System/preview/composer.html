<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:16px;background:var(--bg);}
.box{background:var(--bg-e);border:1px solid var(--bd);border-radius:var(--r-md);padding:10px 12px;display:flex;gap:10px;align-items:center;}
.box:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg);}
input{flex:1;border:none;outline:none;background:transparent;font-family:var(--font-sans);font-size:13px;color:var(--t1);}
input::placeholder{color:var(--t3);}
.send{background:var(--acc);color:#fff;border:none;font-size:11px;font-weight:500;padding:6px 14px;border-radius:var(--r);cursor:pointer;}
</style></head><body>
<div class="box">
  <span class="t-mono-xs">U</span>
  <input placeholder="Continue with next steps..." />
  <button class="send">Send</button>
</div>
</body></html>
