<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:16px;background:var(--bg);}
.row{display:flex;gap:6px;}
.bar{flex:1;height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;font-weight:600;}
.lbl{font-family:var(--font-mono);font-size:9px;color:var(--t3);text-align:center;margin-top:4px;}
</style></head><body>
<div class="row">
  <div><div class="bar" style="background:var(--span-pm);color:var(--span-pm-t)">PM</div><div class="lbl">pm</div></div>
  <div><div class="bar" style="background:var(--span-swe);color:var(--span-swe-t)">SWE</div><div class="lbl">swe</div></div>
  <div><div class="bar" style="background:var(--span-swe2);color:var(--span-swe2-t)">SWE2</div><div class="lbl">swe2</div></div>
  <div><div class="bar" style="background:var(--span-qa);color:var(--span-qa-t)">QA</div><div class="lbl">qa</div></div>
  <div><div class="bar" style="background:var(--span-doc);color:var(--span-doc-t)">DOC</div><div class="lbl">doc</div></div>
  <div><div class="bar" style="background:var(--span-bug);color:var(--span-bug-t)">BUG</div><div class="lbl">bug</div></div>
  <div><div class="bar" style="background:var(--span-rev);color:var(--span-rev-t)">REV</div><div class="lbl">rev</div></div>
</div>
</body></html>
