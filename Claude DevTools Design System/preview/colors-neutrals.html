<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:16px;background:var(--bg);}
.row{display:flex;gap:6px;}
.sw{flex:1;border-radius:var(--r-sm);padding:8px;border:1px solid var(--bd);min-height:76px;display:flex;flex-direction:column;justify-content:space-between;}
.lbl{font-family:var(--font-mono);font-size:9px;color:var(--t2);}
.hex{font-family:var(--font-mono);font-size:10px;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--bg)"><div class="lbl">bg</div><div class="hex">#F7F5F0</div></div>
  <div class="sw" style="background:var(--bg-s)"><div class="lbl">bg-s</div><div class="hex">#EFECE4</div></div>
  <div class="sw" style="background:var(--bg-e)"><div class="lbl">bg-e</div><div class="hex">#FFFFFF</div></div>
  <div class="sw" style="background:var(--bg-h)"><div class="lbl">bg-h</div><div class="hex">#E8E5DC</div></div>
  <div class="sw" style="background:var(--t1);color:#fff"><div class="lbl" style="color:rgba(255,255,255,.7)">t1</div><div class="hex" style="color:#fff">#2C2B28</div></div>
  <div class="sw" style="background:var(--t2);color:#fff"><div class="lbl" style="color:rgba(255,255,255,.7)">t2</div><div class="hex" style="color:#fff">#6B665D</div></div>
  <div class="sw" style="background:var(--t3);color:#fff"><div class="lbl" style="color:rgba(255,255,255,.7)">t3</div><div class="hex" style="color:#fff">#8B8780</div></div>
</div>
</body></html>
