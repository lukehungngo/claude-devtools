<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:16px;background:var(--bg);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.btn{font-family:var(--font-sans);font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--r);border:1px solid var(--bd);background:var(--bg-e);color:var(--t1);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2);}
.btn.sm{font-size:10px;padding:3px 8px;}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
</style></head><body>
<button class="btn primary">Send</button>
<button class="btn">Cancel</button>
<button class="btn ghost">Rewind</button>
<button class="btn danger">Stop run</button>
<button class="btn sm">+ New session</button>
<button class="btn sm" style="color:var(--acc);border-color:var(--acc)">Resume</button>
</body></html>
